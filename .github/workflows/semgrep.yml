on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - main
    - master
    paths:
    - .github/workflows/semgrep.yml
  schedule:
  # random HH:MM to avoid a load spike on GitHub Actions at 00:00
  - cron: 52 10 * * *
name: Semgrep
jobs:
  semgrep:
    name: semgrep/ci
    # GitHub-hosted: no runner ever served the self-hosted label (every run was
    # cancelled), and a self-hosted runner would execute fork PRs' code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    steps:
    - uses: actions/checkout@v6
    # With a Semgrep App token, use the org's policy; without one (forks, or no
    # secret configured) still scan with the public rules, report-only.
    - run: |
        if [ -n "$SEMGREP_APP_TOKEN" ]; then semgrep ci; else semgrep scan --config auto; fi
